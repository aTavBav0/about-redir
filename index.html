<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redir</title>
</head>
<body>

<script>
(() => {
    const params = new URLSearchParams(location.search);
    const viewer = params.get("viewer");

    function validURL(value) {
        try {
            const parsed = new URL(value);
            return ["http:", "https:"].includes(parsed.protocol)
                ? parsed.href : null;
        } catch {
            return null;
        }
    }

    // Viewer mode
    if (viewer) {
        const destination = validURL(viewer);

        if (!destination) {
            document.body.textContent = "Invalid URL.";
            return;
        }

        document.title = "ㅤ";

        document.body.style.cssText =
            "margin:0;width:100vw;height:100vh;overflow:hidden";

        const frame = document.createElement("iframe");

        frame.src = destination;
        frame.allow = "fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; geolocation; display-capture; picture-in-picture; encrypted-media";
        frame.allowFullscreen = true;
        frame.style.cssText =
            "width:100%;height:100%;border:0;display:block";

        document.body.appendChild(frame);

        // Confirmation belongs to the ABOUT:BLANK viewer.
        window.addEventListener("beforeunload", (event) => {
            event.preventDefault();
            event.returnValue = "";
        });

        return;
    }

    // Launcher mode
    const target = params.get("url");

    if (!target) {
        document.body.textContent = "Missing ?url= parameter.";
        return;
    }

    const destination = validURL(target);

    if (!destination) {
        document.body.textContent = "Invalid URL.";
        return;
    }

    const blank = window.open("about:blank", "_blank");

    if (!blank) {
        document.body.textContent = "Popup blocked. Allow popups.";
        return;
    }

    blank.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>ㅤ</title>
            <style>
                * { margin:0; padding:0; }
                html,body {
                    width:100%;
                    height:100%;
                    overflow:hidden;
                }
                iframe {
                    width:100%;
                    height:100%;
                    border:0;
                    display:block;
                }
            </style>
        </head>
        <body>
            <iframe
                id="viewer"
                allow="fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; geolocation; display-capture; picture-in-picture; encrypted-media"
                allowfullscreen>
            </iframe>

            <script>
                document.getElementById("viewer").src =
                    ${JSON.stringify(destination)};

                // Attach the close confirmation to this window.
                window.addEventListener("beforeunload", (event) => {
                    event.preventDefault();
                    event.returnValue = "";
                });
            <\/script>
        </body>
        </html>
    `);

    blank.document.close();

})();
</script>

</body>
</html>
